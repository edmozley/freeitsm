; FreeITSM — session cookie hardening.
;
; PHP reads this file on the FastCGI/CGI SAPIs, which means it covers nginx and IIS.
; Apache with mod_php does NOT read it — see the matching block in .htaccess — and
; the Docker image gets docker/php.ini instead. All three say the same thing.
;
; Why this is a config file and not code: cookie parameters only apply BEFORE
; session_start(), and 809 of the 818 files that call session_start() do so before
; they include config.php, so there is no PHP file early enough to be a hook.
; See includes/session_security.php for the full reasoning.

; Keep JavaScript away from the session cookie. This is the one that matters most:
; without it, any XSS anywhere in the app hands over the session itself rather than
; being confined to the page it fired on.
session.cookie_httponly = 1

; Do not attach the session cookie to cross-site form posts. This is what stands in
; for CSRF tokens. Chrome already defaults to Lax; saying so explicitly is what
; extends the same protection to Firefox and Safari.
session.cookie_samesite = Lax

; Refuse a session ID the browser made up. Without this PHP adopts whatever ID it is
; given, which is what makes session fixation possible in the first place.
session.use_strict_mode = 1

; Belt and braces against ID prediction/leakage.
session.use_only_cookies = 1
session.sid_length = 48
session.sid_bits_per_character = 5

; NOTE: session.cookie_secure is deliberately NOT set here. It cannot be made
; conditional in a static file, and switching it on for an install served over plain
; HTTP — which plenty of internal service desks are — would stop the cookie being
; sent at all and lock everyone out. It is applied at runtime, per request, in
; includes/session_security.php where the scheme is actually known.
