services:
  app:
    # Builds FreeITSM from the source in this directory. That is the right default
    # for developing, and for anyone who wants to see exactly what they are running.
    #
    # To run a published release instead, comment out `build: .` and use a pinned
    # image. You then get the exact bytes that were tested for that version, and you
    # roll back by changing the number and running `docker compose up -d`:
    #
    #   image: ghcr.io/edmozley/freeitsm:1.0.0
    #
    # `:1.0` follows the newest 1.0.x, `:1` the newest 1.x, and `:latest` the newest
    # release of all. Pin the full number in production - `latest` moving under you
    # is the thing version numbers exist to prevent.
    build: .
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_SERVER=db
      - DB_NAME=freeitsm
      - DB_USERNAME=freeitsm
      - DB_PASSWORD=freeitsm
      - ENCRYPTION_KEY_PATH=/var/www/encryption_keys/freeitsm.key
      # Uncomment when a reverse proxy (nginx, Traefik, Caddy, Cloudflare) terminates
      # HTTPS in front of this container. Without it PHP sees plain HTTP and the session
      # cookie is issued without its Secure flag. Leave it off if nothing fronts the
      # container — X-Forwarded-Proto is client-settable, so it must never be trusted
      # by default.
      # - TRUST_PROXY_HTTPS=1
    volumes:
      - attachments:/var/www/html/tickets/attachments
      - cm-attachments:/var/www/html/change-management/attachments
      - encryption-keys:/var/www/encryption_keys

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: freeitsm
      MYSQL_USER: freeitsm
      MYSQL_PASSWORD: freeitsm
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./database/freeitsm.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  attachments:
  cm-attachments:
  encryption-keys:
