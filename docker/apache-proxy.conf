# Apache's OWN redirects, behind a proxy that terminates HTTPS (GH #152).
#
# Some redirects never reach PHP: the pretty-URL rules in .htaccess answer
# /login.php with a 301 to /login, and a folder asked for without its trailing
# slash is redirected by mod_dir. Apache writes those as ABSOLUTE addresses in
# the scheme it was spoken to in - always http behind nginx, Traefik, Caddy or
# a load balancer - so the browser sends plain HTTP to the HTTPS port and gets
# an error page. requestIsHttps() cannot help, because no PHP runs.
#
# A scheme on ServerName makes Apache build them as https. The host and port
# still come from the request (UseCanonicalName is off), so this names no host.
#
# ⚠️ It applies to every request on port 80, so it is only switched on when
# TRUST_PROXY_HTTPS is set - which already means "the proxy is the only way in".
# entrypoint.sh copies this file into place at start, or removes it.
#
# 🔴 It must be inside the <VirtualHost>: a scheme on the GLOBAL ServerName is
# not inherited by the vhost, and changes nothing. (Header edit Location cannot
# do this job either - these redirects go out through Apache's error-response
# path, which rebuilds the headers after mod_headers has run.)
ServerName https://localhost
