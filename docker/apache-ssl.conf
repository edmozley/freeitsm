# HTTPS for the FreeITSM image, using the certificate made on System → Docker.
#
# Shipped disabled. docker/entrypoint.sh enables it (with mod_ssl) on each start
# only when /var/www/tls holds a certificate and key that match, and disables it
# again otherwise — so a missing or broken certificate leaves the container on
# plain HTTP rather than refusing to start.
<IfModule mod_ssl.c>
    <VirtualHost *:443>
        DocumentRoot ${APACHE_DOCUMENT_ROOT}

        SSLEngine on
        SSLCertificateFile    /var/www/tls/server.crt
        SSLCertificateKeyFile /var/www/tls/server.key

        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined
    </VirtualHost>
</IfModule>
