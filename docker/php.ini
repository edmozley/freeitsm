; FreeITSM — PHP settings baked into the Docker image.
;
; The image previously copied no php.ini at all, so PHP's compiled defaults applied:
; session.cookie_httponly=0, session.cookie_samesite="" and session.use_strict_mode=0.
; The last is the worst of the three — it means PHP adopts an attacker-supplied
; session ID instead of minting a fresh one.
;
; Mirrors the root .user.ini (FPM/CGI, i.e. nginx and IIS) and the php_value block in
; .htaccess (Apache mod_php). Change all three together.

session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.use_only_cookies = 1
session.sid_length = 48
session.sid_bits_per_character = 5

; session.cookie_secure is applied at runtime instead — see
; includes/session_security.php. A static "on" would lock out every install served
; over plain HTTP, and the container is commonly run behind a proxy that terminates
; TLS, where PHP cannot tell from the request alone.

; Do not advertise the PHP version in response headers.
expose_php = Off

; Uploads: matches UPLOAD_MAX_BYTES in includes/uploads.php (10 MB) with headroom
; for the multipart envelope.
upload_max_filesize = 12M
post_max_size = 14M

; Send PHP errors to the container's log. GH #129 was a fatal on every single page
; and `docker compose logs` showed nothing but a 500 in the access log, because the
; image sets no php.ini value for this and PHP's compiled default is Off. The
; reporter had to read the source to find out what had broken.
;
; display_errors stays OFF for the browser (docker/config.php) — errors belong in
; the operator's log, not in a visitor's page. error_log is deliberately unset so
; PHP writes to stderr, which is where Docker collects it.
log_errors = On

; ...and keep them out of the browser. docker/config.php already does this with
; ini_set(), but that only takes effect once config.php has RUN — a fatal earlier
; than that (a parse error, a missing include) still printed its file paths and
; stack trace into the response. Setting it here covers the whole request.
display_errors = Off
