# nginx terminating TLS in front of FreeITSM - the setup in GH #152.
# The certificate is self-signed and made when the container starts (see
# docker-compose.yml), so there is nothing secret in the repo.
server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/tls/proxy.crt;
    ssl_certificate_key /etc/nginx/tls/proxy.key;

    location / {
        # Looked up per request through Docker's DNS, not once at start, so the
        # proxy can start before the app (docker-compose.yml says why).
        resolver 127.0.0.11 valid=10s;
        set $app http://app:80;
        proxy_pass $app;
        # $http_host, not $host: keeps the :8453 so absolute links point back here.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        # What a Cloudflare Tunnel sends, for TRUSTED_PROXY_HEADER=CF-Connecting-IP.
        proxy_set_header CF-Connecting-IP  $remote_addr;
    }
}
